name: Sök i P4-radio

# Skriver ut utvalda P4-program (radio.json) med taligenkänning och mejlar
# ställen där tyngdlyftning eller namnen i sokord.json nämns.
on:
  schedule:
    - cron: "17 21 * * *"   # varje kväll, efter eftermiddagsprogrammen
  workflow_dispatch:
    inputs:
      avsnitt:
        description: "Bara dessa avsnitt (SR-id, kommaseparerade), t.ex. 2888373"
        required: false
        default: ""
      mejla:
        description: "Mejla träffarna"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radio
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      matris: ${{ steps.l.outputs.matris }}
      antal: ${{ steps.l.outputs.antal }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: l
        env:
          AVSNITT: ${{ inputs.avsnitt }}
        run: |
          if [ -n "$AVSNITT" ]; then python radio.py lista --avsnitt "$AVSNITT"; else python radio.py lista; fi

  skriv:
    needs: lista
    if: needs.lista.outputs.antal != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.lista.outputs.matris) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-modell-v1
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q faster-whisper
      - name: Skriv ut ${{ matrix.program }} ${{ matrix.datum }}
        env:
          AVSNITT_JSON: ${{ toJSON(matrix) }}
        run: |
          mkdir -p ut
          python radio.py skriv "$AVSNITT_JSON" "ut/${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: traffar-${{ matrix.id }}
          path: ut/${{ matrix.id }}.json
          retention-days: 7

  sammanstall:
    needs: [lista, skriv]
    if: always() && needs.lista.outputs.antal != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: resultat
          pattern: traffar-*
      - name: Samla och mejla träffar
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: "Tyngdlyftning i media"
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MEJLA: ${{ inputs.mejla }}
        run: |
          if [ "$MEJLA" = "false" ]; then python radio.py sammanstall resultat --inget-mejl; else python radio.py sammanstall resultat; fi
      - name: Spara vilka avsnitt som är genomsökta
        run: |
          git config user.name "nyhets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "Radiosökning $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
